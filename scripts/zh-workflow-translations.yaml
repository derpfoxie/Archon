# Source of truth for Chinese mirror workflows.
#
# Each English workflow under .archon/workflows/defaults/ that should have a
# `<name>-zh.yaml` mirror MUST have an entry here (`workflows.<name>`).
# Missing entries cause `bun run generate:zh-workflows` to fail with a list
# of which workflows still need translation.
#
# Fields:
#   description       (required) — replaces the workflow `description` field
#   approvals.<id>    (required when source has an approval node with that id)
#     message            — user-facing approval prompt
#     on_reject_prompt   — required only when source has approval.on_reject
#   loops.<id>        (optional)
#     gate_message       — replaces loop.gate_message; missing → keeps English with a warning
#
# Triggers / file paths / yaml field names / shell commands stay in English so
# the router and CLI examples keep working. Only narrative prose is translated.

workflows:
  archon-adversarial-dev:
    description: |
      使用场景：希望从零开始用对抗式开发完整构建一个应用。
      触发词："adversarial dev"、"adversarial development"、"build with adversarial"、"gan dev"、
                "adversarial build"、"build app adversarially"、"adversarial coding"。
      做什么：受 GAN 启发的三角色开发流——Planner 写带 sprint 的需求规格，随后由状态机循环
              在 Generator（写代码）和 Evaluator（攻击代码）之间切换，并设硬性通过/失败阈值。
              Evaluator 的目标就是把 Generator 写出的东西打破。任何指标低于 7/10，sprint
              退回 Generator 并附上对抗式反馈。达到最大重试次数仍失败则停止。
      不适用于：bug 修复、PR review、重构现有代码、简单的一次性任务。

      参考 Anthropic 关于长周期应用开发的 harness 设计文章；把规划、构建、评估三种角色
      拆开，借助对抗张力提升质量。

  archon-architect:
    description: |
      使用场景：希望对架构做一次扫描、降低复杂度、或改善代码库健康状况。
      触发词："architect"、"simplify codebase"、"reduce complexity"、"architectural sweep"、
                "clean up architecture"、"codebase health"、"fix architecture"。
      做什么：扫描代码库指标 → 用原则化视角分析架构 → 规划针对性的简化任务 → 通过 hooks
              做带自我审查的循环执行 → 完整校验 → 提交 PR。
      不适用于：单文件修复、功能开发、bug 修复、PR review。

      DAG 工作流，演示节点级 hooks：
      - PostToolUse hook 形成自然的质量闭环（写完文件就跑 lint、自我审查）
      - PreToolUse hook 在改动前注入架构原则
      - 不同节点拥有不同的信任级别和引导强度

  archon-assist:
    description: |
      使用场景：没有其他工作流匹配请求时使用。
      处理：问题、调试、探索、一次性任务、解释说明、CI 失败、通用帮助。
      能力：完整的 Claude Code agent，所有工具可用。
      备注：使用 assist 模式时会通知用户，便于追踪。

  archon-comprehensive-pr-review:
    description: |
      使用场景：希望对一个 Pull Request 做全面 code review，并自动修掉发现的问题。
      触发词："review this PR"、"review PR #123"、"comprehensive review"、"full PR review"、
                "review and fix"、"check this PR"、"code review"。
      做什么：把 PR 与 main 同步（必要时 rebase）→ 并行跑 5 个专项 review agent →
              汇总发现 → 自动修复 CRITICAL / HIGH 级别问题 → 报告剩余问题。
      不适用于：对 PR 的简短问询、查看 CI 状态、简单的"改了什么"询问。

      产物保存在 $ARTIFACTS_DIR/../reviews/pr-{number}/，并在 GitHub PR 上发表
      一条完整的 review 评论。

  archon-create-issue:
    description: |
      使用场景：希望把一个 bug 或问题作为 GitHub issue 上报，并自动提供复现。
      触发词："create issue"、"file a bug"、"report this bug"、"open an issue for"、
                "create github issue"、"report issue"、"log this bug"。
      做什么：分类问题领域（haiku）→ 并行收集上下文（模板、git 状态、重复 issue）→
              调研相关代码 → 用领域专属工具复现（agent-browser、CLI、数据库查询等）→
              在复现成功这一道关上把关 → 带完整证据创建 issue；如无法复现则反馈给用户。
      不适用于：功能请求、增强建议或非 bug 类工作。仅用于 bug / 问题。

      复现门控：如果无法复现，工作流不会创建 issue；它会反馈尝试过的做法，并向用户
      提出后续步骤建议。

  archon-feature-development:
    description: |
      使用场景：基于一份已有的实现计划开发新功能。
      输入：计划文件路径（$ARTIFACTS_DIR/plan.md），或包含计划的 GitHub issue。
      做什么：带校验循环地实现计划 → 创建 Pull Request。
      不适用于：起草计划（计划应单独完成）、bug 修复、code review。

  archon-fix-github-issue:
    description: |
      使用场景：希望修复、解决或为某个 GitHub issue 实现解决方案。
      触发词："fix this issue"、"implement issue #123"、"resolve this bug"、"fix it"、
                "fix issue"、"resolve issue"、"fix #123"。
      不适用于：综合多 agent review（请用 archon-issue-review-full）、关于 issue 的
                询问、CI 失败、PR review、一般探索。

      DAG 工作流：
      1. 对 issue 分类（bug / 功能 / 增强 等）
      2. 调研上下文（联网调研 + 通过 investigate / plan 探索代码库）
      3. 根据分类路由到 investigate（bug）或 plan（功能）
      4. 带校验地实现修复 / 功能
      5. 用仓库 PR 模板创建 draft PR
      6. 跑 smart review（始终包含 code review + CLAUDE.md 检查；按需追加其它 agent）
      7. 主动修掉所有发现（测试、文档、错误处理）
      8. 简化变更代码（直接落代码而不是只写报告）
      9. 把结果回传给 GitHub issue，并附后续建议

  archon-idea-to-pr:
    description: |
      使用场景：拥有一个功能 idea 或描述，希望端到端走完整开发流程。
      输入：自然语言的功能描述，或一份 PRD 文件路径。
      输出：完成全面 review、可合并的 PR。

      完整流程：
      1. 结合代码库分析撰写完整的实现计划
      2. 建分支并提取范围限制
      3. 验证计划研究是否仍然成立
      4. 带类型检查地实现所有任务
      5. 跑完整校验套件
      6. 用模板创建 PR、置为 ready
      7. 完整 code review（5 个并行 agent，知晓范围限制）
      8. 汇总并修复 review 发现
      9. 输出最终摘要与决策矩阵 → GitHub 评论 + 后续建议

      不适用于：执行已有计划（请用 archon-plan-to-pr）、快修、独立 review。

  archon-interactive-prd:
    description: |
      使用场景：通过引导式对话编写 PRD。
      触发词："create a prd"、"new prd"、"interactive prd"、"plan a feature"、
                "product requirements"、"write a prd"。
      不适用于：无人工参与的全自动 PRD 生成（请用 archon-ralph-generate）。

      问题导向的引导式 PRD 撰写流程：
      1. 理解 idea → 抛出基础问题 → 等待回答
      2. 调研市场与代码库 → 抛出深入问题 → 等待回答
      3. 评估技术可行性 → 抛出范围问题 → 等待回答
      4. 生成 PRD → 比对代码库验证技术声明 → 输出
    approvals:
      foundation-gate:
        message: |
          请回答上面的基础问题。你的回答将引导调研阶段。
      deepdive-gate:
        message: |
          请回答上面的深入问题（愿景、核心用户、JTBD、约束）。如有调研后的修正，请一并补充。
      scope-gate:
        message: |
          请回答上面的范围问题（MVP、必备项、假设、不在范围内的事项）。这是 PRD 生成前的最后一次输入。

  archon-issue-review-full:
    description: |
      使用场景：希望对一个 GitHub issue 跑完整的"修复 + 全面 review"管线。
      触发词："full review"、"comprehensive fix"、"fix with full review"、"deep review"、
                "issue review full"。
      不适用于：简单的 issue 修复（请用 archon-fix-github-issue）、关于 issue 的询问、
                CI 失败、PR review、一般探索。

      完整流程：
      1. 调研 issue → 根因分析、实现计划
      2. 实现修复 → 代码改动、测试、创建 PR
      3. 综合 review → 5 个并行 agent，知晓范围
      4. 修复 review 发现 → 处理 CRITICAL / HIGH 项
      5. 最终摘要 → 决策矩阵、后续建议

  archon-piv-loop:
    description: |
      使用场景：希望走"计划-实现-校验"三段式 + 人工参与的引导式开发。
      触发词："piv"、"piv loop"、"plan implement validate"、"guided development"、
                "structured development"、"build a feature"、"develop with review"。
      不适用于：无规划阶段的全自动实现（请用 archon-feature-development）、
                PRD 撰写（请用 archon-interactive-prd）、
                Ralph story 风格的实现（请用 archon-ralph-dag）。

      交互式 PIV 循环——AI 编码方法论的基础形态：
      1. EXPLORE：与人类反复对话以理解问题（轮次不限）
      2. PLAN：构建结构化计划 → 反复 review 与修订（轮次不限）
      3. IMPLEMENT：基于计划自动逐任务实现（Ralph loop）
      4. VALIDATE：自动 code review → 反复人工反馈与修复（轮次不限）

      PIV 循环发生在 PRD 已经存在之后，每轮聚焦一个细粒度的功能或 bug 修复。
      输入：要构建什么的描述、已有计划文件路径，或 GitHub issue 编号。
    loops:
      explore:
        gate_message: |
          请回答上面的问题，让我去探索某个具体方向；如果你对当前探索满意，回答 "ready" 即可。
      refine-plan:
        gate_message: |
          请审阅计划文档；告诉我具体要修改什么，或回答 "approved" 进入实现阶段。
      fix-feedback:
        gate_message: |
          请亲自测试实现并审阅代码改动；告诉我哪里需要修复，或回答 "approved" 完成本轮。

  archon-plan-to-pr:
    description: |
      使用场景：已有一份实现计划，希望端到端执行直至 PR 完成。
      输入：计划文件路径（$ARTIFACTS_DIR/plan.md 或 .agents/plans/*.md）。
      输出：完成全面 review、可合并的 PR。

      完整流程：
      1. 读取计划、建分支、提取范围限制
      2. 验证计划研究是否仍然成立
      3. 带类型检查地实现所有任务
      4. 跑完整校验套件
      5. 用模板创建 PR、置为 ready
      6. 完整 code review（5 个并行 agent，知晓范围限制）
      7. 汇总并修复 review 发现
      8. 输出最终摘要与决策矩阵 → GitHub 评论 + 后续建议

      不适用于：从头起草计划（请用 archon-idea-to-pr）、快修、独立 review。

  archon-ralph-dag:
    description: |
      使用场景：希望跑一轮 Ralph 实现循环。
      触发词："ralph"、"run ralph"、"ralph dag"、"run ralph dag"。

      DAG 工作流：
      1. 探测输入：已有 prd.json、已有 prd.md（需补 stories）、或纯 idea
      2. 必要时生成 prd.md + prd.json（探索代码库、拆分 stories）
      3. 验证 PRD 文件、读取项目上下文、安装依赖
      4. 跑 Ralph loop（每轮 fresh context），每轮实现一个 story
      5. 创建 PR 并报告完成情况

      接受：idea 描述、已有 prd.md 文件路径、或包含 prd.md + prd.json 的目录。

  archon-refactor-safely:
    description: |
      使用场景：希望在持续校验和保留行为的前提下安全重构代码。
      触发词："refactor"、"refactor safely"、"split this file"、"extract module"、"break up"、
                "decompose"、"safe refactor"、"split file"、"extract into modules"。
      做什么：扫描重构范围 → 只读分析影响面 → 规划有序任务列表 → 每次编辑后跑类型检查
              hook → 跑完整校验 → 只读地验证行为不变 → 用前后对比创建 PR。
      不适用于：bug 修复（请用 archon-fix-github-issue）、功能开发（请用 archon-feature-development）、
                通用架构扫描（请用 archon-architect）、PR review。

      关键安全特性：
      - 分析与验证节点为只读（denied_tools: [Write, Edit, Bash]）
      - PreToolUse hook 检查每次编辑是否在计划内
      - PostToolUse hook 在每次文件变更后强制类型检查
      - 行为校验确认重构后逻辑不变

  archon-remotion-generate:
    description: |
      使用场景：希望用 AI 生成或修改一段 Remotion 视频合成。
      触发词："create a video"、"generate video"、"remotion"、"make an animation"、
                "video about"、"animate"。
      做什么：AI 编写 Remotion React 代码 → 渲染预览静帧 → 渲染完整视频 → 总结输出。
      要求：当前工作目录下已有 Remotion 项目（src/index.ts、src/Root.tsx）。
      可选：安装 remotion-best-practices skill 以提升输出质量：
              npx skills add remotion-dev/skills

  archon-resolve-conflicts:
    description: |
      使用场景：PR 出现合并冲突需要解决。
      触发词："resolve conflicts"、"fix merge conflicts"、"rebase this PR"、"resolve this"、
                "fix conflicts"、"merge conflicts"、"rebase and fix"。
      做什么：拉取最新 base 分支 → 分析冲突 → 自动解决简单冲突 → 对复杂冲突给出选项 →
              提交并推送解决结果。
      不适用于：没有冲突的 PR、无冲突的常规 rebase、压缩 commit。

      该工作流通过分析冲突变更，在意图明确处自动解决，并对复杂冲突列出可选项。

  archon-smart-pr-review:
    description: |
      使用场景：希望按 PR 复杂度自适应地做一次高效 review。
      触发词："smart review"、"review this PR"、"review PR #123"、"efficient review"、
                "smart PR review"、"quick review"。
      做什么：收集 PR 范围 → 分类复杂度 → 仅路由到相关的 review agent → 汇总发现 →
              自动修复 CRITICAL / HIGH 级别问题。
      不适用于：明确想跑全部 review agent 的情况（请用 archon-comprehensive-pr-review）。

      与 comprehensive review 不同，本工作流先分类 PR、再只跑相关 agent。一处三行的 typo
      修复会跳过 test-coverage 与 docs-impact。

  archon-test-loop-dag:
    description: |
      使用场景：用户明确说 "test-loop-dag" 或 "run test-loop-dag"。
      重要：这是带 loop 节点的 DAG 工作流，会一直迭代直到完成。
      不适用于：通用测试问题或调试。
      做什么：初始化一个计数器，迭代到 3 时报告完成。

  archon-validate-pr:
    description: |
      使用场景：希望对 PR 做彻底校验——同时在 main（bug 存在）和 feature 分支（bug 已修复）
                上跑测试。
      触发词："validate PR"、"validate pr #123"、"test this PR"、"verify PR"、
                "full PR validation"、"validate pull request"、"test PR end-to-end"。
      做什么：拉取 PR 信息 → 找到空闲端口 → 并行 code review（main 与 feature）→
              在 main 上跑 E2E（复现 bug）→ 在 feature 上跑 E2E（验证修复）→ 给出最终结论。
      不适用于：仅看代码的快速 review（请用 archon-smart-pr-review）、修问题、一般探索。

      该工作流为并行运行设计——每个实例自己找空闲端口避免冲突。产物保存在 $ARTIFACTS_DIR/，
      并发布一份校验报告。

  archon-workflow-builder:
    description: |
      使用场景：希望为当前项目创建一份自定义工作流。
      触发词："build me a workflow"、"create a workflow"、"generate a workflow"、
                "new workflow"、"make a workflow for"、"workflow builder"。
      做什么：扫描代码库 → 提取意图（JSON）→ 生成 YAML → 校验 → 保存。
      不适用于：编辑已有工作流，或创建非工作流类文件。
