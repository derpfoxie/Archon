name: archon-smart-pr-review-zh
description: |
  使用场景：希望按 PR 复杂度自适应地做一次高效 review。
  触发词："smart review"、"review this PR"、"review PR #123"、"efficient review"、
            "smart PR review"、"quick review"。
  做什么：收集 PR 范围 → 分类复杂度 → 仅路由到相关的 review agent → 汇总发现 →
          自动修复 CRITICAL / HIGH 级别问题。
  不适用于：明确想跑全部 review agent 的情况（请用 archon-comprehensive-pr-review）。

  与 comprehensive review 不同，本工作流先分类 PR、再只跑相关 agent。一处三行的 typo
  修复会跳过 test-coverage 与 docs-impact。
nodes:
  - id: scope
    command: archon-pr-review-scope
    systemPrompt: Respond in Simplified Chinese (简体中文).
  - id: sync
    command: archon-sync-pr-with-main
    depends_on:
      - scope
    systemPrompt: Respond in Simplified Chinese (简体中文).
  - id: classify
    prompt: |
      You are a PR complexity classifier. Analyze the PR scope below and determine
      which review agents should run.

      ## PR Scope
      $scope.output

      ## Rules
      - **Code review**: Always run unless the diff is empty or only touches non-code files
        (e.g. README-only, config-only, or .yaml-only changes).
      - **Error handling**: Run if the diff touches code with try/catch, error handling,
        async/await, or adds new failure paths.
      - **Test coverage**: Run if the diff touches source code (not just tests, docs, or config).
      - **Comment quality**: Run if the diff adds or modifies comments, docstrings, JSDoc,
        or significant documentation within code files.
      - **Docs impact**: Run if the diff adds/removes/renames public APIs, commands, CLI flags,
        environment variables, or user-facing features.

      Classify the PR complexity:
      - **trivial**: Typo fixes, formatting, single-line changes, version bumps
      - **small**: 1-3 files, straightforward logic, no architectural changes
      - **medium**: 4-10 files, moderate logic changes, some cross-cutting concerns
      - **large**: 10+ files, architectural changes, new subsystems, complex refactors

      Provide your reasoning for each decision.
    depends_on:
      - scope
    model: haiku
    allowed_tools: []
    output_format:
      type: object
      properties:
        run_code_review:
          type: string
          enum:
            - "true"
            - "false"
        run_error_handling:
          type: string
          enum:
            - "true"
            - "false"
        run_test_coverage:
          type: string
          enum:
            - "true"
            - "false"
        run_comment_quality:
          type: string
          enum:
            - "true"
            - "false"
        run_docs_impact:
          type: string
          enum:
            - "true"
            - "false"
        complexity:
          type: string
          enum:
            - trivial
            - small
            - medium
            - large
        reasoning:
          type: string
      required:
        - run_code_review
        - run_error_handling
        - run_test_coverage
        - run_comment_quality
        - run_docs_impact
        - complexity
        - reasoning
    systemPrompt: Respond in Simplified Chinese (简体中文).
  - id: code-review
    command: archon-code-review-agent
    depends_on:
      - classify
      - sync
    when: $classify.output.run_code_review == 'true'
    systemPrompt: Respond in Simplified Chinese (简体中文).
  - id: error-handling
    command: archon-error-handling-agent
    depends_on:
      - classify
      - sync
    when: $classify.output.run_error_handling == 'true'
    systemPrompt: Respond in Simplified Chinese (简体中文).
  - id: test-coverage
    command: archon-test-coverage-agent
    depends_on:
      - classify
      - sync
    when: $classify.output.run_test_coverage == 'true'
    systemPrompt: Respond in Simplified Chinese (简体中文).
  - id: comment-quality
    command: archon-comment-quality-agent
    depends_on:
      - classify
      - sync
    when: $classify.output.run_comment_quality == 'true'
    systemPrompt: Respond in Simplified Chinese (简体中文).
  - id: docs-impact
    command: archon-docs-impact-agent
    depends_on:
      - classify
      - sync
    when: $classify.output.run_docs_impact == 'true'
    systemPrompt: Respond in Simplified Chinese (简体中文).
  - id: synthesize
    command: archon-synthesize-review
    depends_on:
      - code-review
      - error-handling
      - test-coverage
      - comment-quality
      - docs-impact
    trigger_rule: one_success
    systemPrompt: Respond in Simplified Chinese (简体中文).
  - id: implement-fixes
    command: archon-implement-review-fixes
    depends_on:
      - synthesize
    systemPrompt: Respond in Simplified Chinese (简体中文).
  - id: check-ntfy
    bash: test -f .archon/mcp/ntfy.json && echo 'true' || echo 'false'
    depends_on:
      - implement-fixes
  - id: notify
    depends_on:
      - check-ntfy
      - synthesize
      - implement-fixes
    when: $check-ntfy.output == 'true'
    trigger_rule: all_success
    mcp: .archon/mcp/ntfy.json
    allowed_tools: []
    prompt: |
      Send a push notification summarizing the PR review results.

      Review synthesis:
      $synthesize.output

      Fix results:
      $implement-fixes.output

      Send with:
      - title: "PR Review Complete"
      - message: 1-2 sentence summary — verdict and issue count. Short enough for a lock screen.
      - priority: 3 if ready to merge, 4 if needs fixes, 5 if critical issues remain
    systemPrompt: Respond in Simplified Chinese (简体中文).
