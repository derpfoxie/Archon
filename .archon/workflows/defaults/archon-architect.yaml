name: archon-architect
description: |
  Use when: 希望对架构做一次扫描、降低复杂度、或改善代码库健康状况。
  Triggers: "architect", "simplify codebase", "reduce complexity", "architectural sweep",
            "clean up architecture", "codebase health", "fix architecture".
  Does: 扫描代码库指标 → 用原则化视角分析架构 → 规划针对性的简化任务 → 通过 hooks
        做带自我审查的循环执行 → 完整校验 → 提交 PR。
  NOT for: 单文件修复、功能开发、bug 修复、PR review。

  DAG 工作流，演示节点级 hooks：
  - PostToolUse hook 形成自然的质量闭环（写完文件就跑 lint、自我审查）
  - PreToolUse hook 在改动前注入架构原则
  - 不同节点拥有不同的信任级别和引导强度

provider: claude

nodes:
  # ═══════════════════════════════════════════════════════════════
  # 阶段 1：度量
  # 收集原始指标 — 文件大小、复杂度热点、依赖扇出
  # ═══════════════════════════════════════════════════════════════

  - id: scan-metrics
    bash: |
      echo "=== FILE SIZE HOTSPOTS (top 30 largest source files) ==="
      find . -name '*.ts' -not -path '*/node_modules/*' -not -path '*/.git/*' -not -path '*/dist/*' \
        -exec wc -l {} + 2>/dev/null | sort -rn | head -30

      echo ""
      echo "=== IMPORT FAN-OUT (files with most imports) ==="
      for f in $(find . -name '*.ts' -not -path '*/node_modules/*' -not -path '*/.git/*' -not -path '*/dist/*'); do
        count=$(grep -c "^import " "$f" 2>/dev/null) || count=0
        if [ "$count" -gt 8 ]; then
          echo "$count imports: $f"
        fi
      done | sort -rn | head -20

      echo ""
      echo "=== EXPORT FAN-OUT (files with most exports) ==="
      for f in $(find . -name '*.ts' -not -path '*/node_modules/*' -not -path '*/.git/*' -not -path '*/dist/*'); do
        count=$(grep -c "^export " "$f" 2>/dev/null) || count=0
        if [ "$count" -gt 5 ]; then
          echo "$count exports: $f"
        fi
      done | sort -rn | head -20

      echo ""
      echo "=== FUNCTION LENGTH HOTSPOTS (functions over 50 lines) ==="
      grep -rn "^\(export \)\?\(async \)\?function \|=> {$" \
        --include='*.ts' --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist . 2>/dev/null \
        | head -30

      echo ""
      echo "=== TYPE SAFETY GAPS ==="
      echo "any usage:"
      grep -rn ": any\b\|as any\b" --include='*.ts' --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist . 2>/dev/null | wc -l
      echo "eslint-disable comments:"
      grep -rn "eslint-disable" --include='*.ts' --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist . 2>/dev/null | wc -l
    timeout: 60000

  # ═══════════════════════════════════════════════════════════════
  # 阶段 2：分析
  # 用架构视角审查热点文件
  # Hooks 在每次读取文件后注入评估标准
  # ═══════════════════════════════════════════════════════════════

  - id: analyze
    prompt: |
      你是一位正在进行代码库健康评估的高级软件架构师。

      ## 代码库指标

      $scan-metrics.output

      ## 用户关注点

      $ARGUMENTS

      ## 指示

      1. 读取上面指标标记的前 10-15 个文件（最大的、导入最多的、导出最多的）
      2. 对每个文件，评估读取后注入的标准（你会看到它们）
      3. 建立一个架构关注点的运行列表
      4. 关注：
         - 做太多事情的模块（违反单一职责原则）
         - 不值得其复杂度的抽象
         - 应该合并的重复模式（三振原则）
         - 上帝文件或上帝函数
         - 泄漏的抽象或层间的紧耦合
         - 死代码或未使用的导出
      5. 暂不建议修改 — 只诊断

      ## 输出

      将结构化评估写入 $ARTIFACTS_DIR/architecture-assessment.md，包含：
      - 执行摘要（3-5 句话）
      - 按影响排序的主要发现
      - 对每个发现：文件、问题所在、为什么重要、预估工作量
    depends_on: [scan-metrics]
    context: fresh
    denied_tools: [Write, Edit, Bash]
    hooks:
      PostToolUse:
        - matcher: "Read"
          response:
            hookSpecificOutput:
              hookEventName: PostToolUse
              additionalContext: >
                对于刚读取的文件，评估：
                (1) 单一职责 — 这个模块是否只做一件事？
                (2) 认知负荷 — 新团队成员能在 5 分钟内理解吗？
                (3) 抽象价值 — 每个抽象是否值得其复杂度，还是过早抽象？
                (4) 依赖方向 — 这个文件是否依赖于同级或下级的东西，而不是上级？
                将任何关注点添加到你的运行列表中。要具体 — 引用行号范围和函数名。

  # ═══════════════════════════════════════════════════════════════
  # 阶段 3：规划
  # 确定变更的优先级和范围 — 纯推理，不使用工具
  # ═══════════════════════════════════════════════════════════════

  - id: plan
    prompt: |
      你正在规划针对性的架构改进。

      ## 评估

      $analyze.output

      ## 原则

      - KISS：偏好直接而非巧妙
      - YAGNI：移除投机性抽象
      - 三振原则：只在一个模式出现 3 次以上时才提取
      - 每个变更必须可独立回滚
      - 不要将重构与行为变更混合
      - 范围限定在一次可以安全完成的工作（最多 5-7 个文件）

      ## 指示

      1. 从评估中，选择前 3-5 个最高影响、最低风险的改进
      2. 对每个改进，写一个精确的计划：哪个文件、改什么、为什么
      3. 排序使每个变更独立（变更间没有级联依赖）
      4. 评估影响范围 — 有多少其他文件受影响

      ## 输出

      将计划写成编号列表。要具体说明要修改什么代码。
      保持简洁 — 执行节点会严格按照此执行。
    depends_on: [analyze]
    allowed_tools: [Read]
    context: fresh

  # ═══════════════════════════════════════════════════════════════
  # 阶段 4：执行
  # 通过 hooks 创建质量反馈循环来执行变更
  # ═══════════════════════════════════════════════════════════════

  - id: simplify
    prompt: |
      你正在实现针对性的架构简化。

      ## 计划

      $plan.output

      ## 规则

      - 严格按照计划执行 — 不要添加你注意到的额外改进
      - 每个变更必须保留现有行为（仅重构，不改变功能）
      - 每次编辑文件后，你会被提示进行验证 — 按照那些指示执行
      - 如果变更比预期更难，跳过它继续
      - 每个逻辑变更单独提交，使用清晰的提交信息

      ## 指示

      1. 按顺序处理计划项
      2. 对每个项：读取文件、进行变更、遵循编辑后检查清单
      3. 所有变更后，执行最终的 `git diff --stat` 来验证范围
    depends_on: [plan]
    context: fresh
    hooks:
      PreToolUse:
        - matcher: "Write|Edit"
          response:
            hookSpecificOutput:
              hookEventName: PreToolUse
              additionalContext: >
                写入前：这个文件在你的计划中吗？如果不是，解释为什么你要修改它。
                检查有多少文件从这个模块导入 — 对广泛导入的模块的变更需要额外审查。
      PostToolUse:
        - matcher: "Write|Edit"
          response:
            systemMessage: >
              你刚修改了一个文件。在继续之前立即做这些事情：
              1. 运行类型检查器验证你的变更能编译
              2. 重新读取你修改的文件 — 它真的更简单了吗，还是你只是转移了复杂度？
              3. 用一句话说明为什么这个变更降低了复杂度。如果无法证明，就回滚它。
        - matcher: "Read"
          response:
            hookSpecificOutput:
              hookEventName: PostToolUse
              additionalContext: >
                修改这个文件前，考虑：你的变更会减少还是增加读者需要在脑中保持的概念数量？
        - matcher: "Bash"
          response:
            hookSpecificOutput:
              hookEventName: PostToolUse
              additionalContext: >
                检查退出代码。如果命令失败，在尝试修复前诊断根本原因。不要盲目重试。

  # ═══════════════════════════════════════════════════════════════
  # 阶段 5：校验
  # 运行完整校验套件 — 仅限 bash，不能编辑来"修复"失败
  # ═══════════════════════════════════════════════════════════════

  - id: validate
    bash: |
      echo "=== TYPE CHECK ==="
      bun run type-check 2>&1
      TC_EXIT=$?

      echo ""
      echo "=== LINT ==="
      bun run lint 2>&1
      LINT_EXIT=$?

      echo ""
      echo "=== TESTS ==="
      bun run test 2>&1
      TEST_EXIT=$?

      echo ""
      echo "=== RESULTS ==="
      echo "Type check: $([ $TC_EXIT -eq 0 ] && echo 'PASS' || echo 'FAIL')"
      echo "Lint: $([ $LINT_EXIT -eq 0 ] && echo 'PASS' || echo 'FAIL')"
      echo "Tests: $([ $TEST_EXIT -eq 0 ] && echo 'PASS' || echo 'FAIL')"

      # Always exit 0 so downstream nodes can read output and decide
      if [ $TC_EXIT -eq 0 ] && [ $LINT_EXIT -eq 0 ] && [ $TEST_EXIT -eq 0 ]; then
        echo "VALIDATION_STATUS: PASS"
      else
        echo "VALIDATION_STATUS: FAIL"
      fi
    depends_on: [simplify]
    timeout: 300000

  # ═══════════════════════════════════════════════════════════════
  # 阶段 6：修复校验失败（如果有）
  # 仅在校验失败时运行 — 使用相同的质量 hooks 进行针对性修复
  # ═══════════════════════════════════════════════════════════════

  - id: fix-failures
    prompt: |
      审查下面的校验输出。

      ## 校验输出

      $validate.output

      ## 指示

      如果输出以 "VALIDATION_STATUS: PASS" 结尾，回复
      "所有检查通过 — 无需修复。" 并停止。

      如果有失败：

      1. 仔细阅读校验失败
      2. 只修复损坏的部分 — 不要做额外的改进
      3. 如果修复需要改变行为（不只是修复类型/lint 错误），
         回滚原始变更
      4. 每次修复后运行特定的失败检查以确认通过
      5. 所有修复后，运行完整校验套件：`bun run validate`
    depends_on: [validate]
    context: fresh
    hooks:
      PostToolUse:
        - matcher: "Write|Edit"
          response:
            systemMessage: >
              你刚做了一个修复。立即运行特定的失败校验检查来验证你的修复有效。
              不要批量修复 — 逐个验证。
      PreToolUse:
        - matcher: "Write|Edit"
          response:
            hookSpecificOutput:
              hookEventName: PreToolUse
              additionalContext: >
                你只在修复校验失败。不要做任何超出通过失败检查所需的变更。
                如果有疑问，回滚导致失败的原始变更。

  # ═══════════════════════════════════════════════════════════════
  # 阶段 7：创建 PR
  # Hooks 确保此节点只执行 git 操作
  # ═══════════════════════════════════════════════════════════════

  - id: create-pr
    prompt: |
      为架构改进创建一个 pull request。

      ## 上下文

      - 架构评估：$analyze.output
      - 计划：$plan.output
      - 校验：$validate.output

      ## 指示

      1. 暂存所有变更并创建单个提交（或验证现有提交）
      2. 推送分支：`git push -u origin HEAD`
      3. 检查是否已存在 PR：`gh pr list --head $(git branch --show-current)`
      4. 创建目标为 `$BASE_BRANCH` 作为基础分支的 PR：
         `gh pr create --base $BASE_BRANCH --title "..." --body "..."`
         - 标题：简要描述简化了什么（不超过 70 字符）
         - 正文：使用下面的格式
      5. 将 PR URL 保存到 `$ARTIFACTS_DIR/.pr-url`

      ## PR 正文格式

      ```markdown
      ## 架构扫描

      **重点**：$ARGUMENTS

      ### 评估

      [架构评估的 3-5 句话摘要]

      ### 变更

      [对每个变更：什么文件、简化了什么、为什么]

      ### 校验

      - [x] 类型检查通过
      - [x] lint 通过
      - [x] 测试通过
      - [x] 每个变更保留现有行为
      ```
    depends_on: [fix-failures]
    context: fresh
    hooks:
      PreToolUse:
        - matcher: "Write|Edit"
          response:
            hookSpecificOutput:
              hookEventName: PreToolUse
              permissionDecision: deny
              permissionDecisionReason: "PR 创建节点 — 不要修改源文件。只使用 git 和 gh 命令。"
      PostToolUse:
        - matcher: "Bash"
          response:
            hookSpecificOutput:
              hookEventName: PostToolUse
              additionalContext: >
                验证此命令是否成功。如果 git push 或 gh pr create 失败，
                在重试前仔细阅读错误信息。

  - id: verify-pr-base
    bash: |
      set -euo pipefail
      EXPECTED="$BASE_BRANCH"
      ACTUAL=$(gh pr view --json baseRefName -q '.baseRefName')
      if [ "$ACTUAL" != "$EXPECTED" ]; then
        PR_NUMBER=$(gh pr view --json number -q '.number')
        echo "Base mismatch on PR #$PR_NUMBER: expected=$EXPECTED actual=$ACTUAL — re-targeting" >&2
        gh pr edit "$PR_NUMBER" --base "$EXPECTED"
      else
        echo "PR base verified: $EXPECTED"
      fi
    depends_on: [create-pr]
