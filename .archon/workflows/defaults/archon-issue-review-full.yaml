name: archon-issue-review-full
description: |
  Use when: 希望对 GitHub issue 进行完整的、全面的修复 + review 流程。
  Triggers: "full review", "comprehensive fix", "fix with full review", "deep review", "issue review full".
  NOT for: 简单 issue 修复（请用 archon-fix-github-issue）、
           关于 issue 的询问、CI 失败、PR review、一般探索。

  完整工作流：
  1. 调研 issue → 根因分析、实现计划
  2. 实现修复 → 代码变更、测试、创建 PR
  3. 全面 review → 5 个并行 agent，带范围感知
  4. 修复 review 问题 → 处理 CRITICAL/HIGH 发现
  5. 最终总结 → 决策矩阵、后续建议

nodes:
  # ═══════════════════════════════════════════════════════════════════
  # PHASE 1: INVESTIGATE
  # ═══════════════════════════════════════════════════════════════════

  - id: investigate
    command: archon-investigate-issue

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 2: IMPLEMENT
  # ═══════════════════════════════════════════════════════════════════

  - id: implement
    command: archon-implement-issue
    depends_on: [investigate]
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 3: CODE REVIEW
  # ═══════════════════════════════════════════════════════════════════

  - id: verify-pr-base
    bash: |
      set -euo pipefail
      EXPECTED="$BASE_BRANCH"
      ACTUAL=$(gh pr view --json baseRefName -q '.baseRefName')
      if [ "$ACTUAL" != "$EXPECTED" ]; then
        PR_NUMBER=$(gh pr view --json number -q '.number')
        echo "Base mismatch on PR #$PR_NUMBER: expected=$EXPECTED actual=$ACTUAL — re-targeting" >&2
        gh pr edit "$PR_NUMBER" --base "$EXPECTED"
      else
        echo "PR base verified: $EXPECTED"
      fi
    depends_on: [implement]

  - id: review-scope
    command: archon-pr-review-scope
    depends_on: [verify-pr-base]
    context: fresh

  - id: sync
    command: archon-sync-pr-with-main
    depends_on: [review-scope]
    context: fresh

  - id: code-review
    command: archon-code-review-agent
    depends_on: [sync]
    context: fresh

  - id: error-handling
    command: archon-error-handling-agent
    depends_on: [sync]
    context: fresh

  - id: test-coverage
    command: archon-test-coverage-agent
    depends_on: [sync]
    context: fresh

  - id: comment-quality
    command: archon-comment-quality-agent
    depends_on: [sync]
    context: fresh

  - id: docs-impact
    command: archon-docs-impact-agent
    depends_on: [sync]
    context: fresh

  - id: synthesize
    command: archon-synthesize-review
    depends_on: [code-review, error-handling, test-coverage, comment-quality, docs-impact]
    trigger_rule: one_success
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 4: FIX REVIEW ISSUES
  # ═══════════════════════════════════════════════════════════════════

  - id: implement-fixes
    command: archon-implement-review-fixes
    depends_on: [synthesize]
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 5: FINAL SUMMARY
  # ═══════════════════════════════════════════════════════════════════

  - id: summary
    command: archon-workflow-summary
    depends_on: [implement-fixes]
    context: fresh
