name: archon-adversarial-dev
description: |
  Use when: 希望从零开始用对抗式开发完整构建一个应用。
  Triggers: "adversarial dev", "adversarial development", "build with adversarial", "gan dev",
            "adversarial build", "build app adversarially", "adversarial coding".
  Does: 受 GAN 启发的三角色开发流——Planner 写带 sprint 的需求规格，随后由状态机循环
        在 Generator（写代码）和 Evaluator（攻击代码）之间切换，并设硬性通过/失败阈值。
        Evaluator 的目标就是把 Generator 写出的东西打破。任何指标低于 7/10，sprint
        退回 Generator 并附上对抗式反馈。达到最大重试次数仍失败则停止。
  NOT for: bug 修复、PR review、重构现有代码、简单的一次性任务。

  参考 Anthropic 关于长周期应用开发的 harness 设计文章；把规划、构建、评估三种角色
  拆开，借助对抗张力提升质量。
provider: claude
model: sonnet

nodes:
  # ─── 阶段 1：规划 ───────────────────────────────────────────────
  - id: plan
    prompt: |
      你是一位产品规划专家。你的工作是接受一个简短的用户提示，并将其扩展为一个全面的产品规格说明。

      ## 用户请求

      $ARGUMENTS

      ## 你的任务

      使用 Write 工具将全面的产品规格说明写入文件 `$ARTIFACTS_DIR/spec.md`。

      规格说明必须包含以下所有部分：

      ### 1. 产品概述
      产品做什么、面向谁、核心价值主张。

      ### 2. 技术栈
      具体的技术、框架和库。要有主见 — 选择具体方案，不要写"一个现代框架"。在相关处包含确切的包名和版本。

      ### 3. 设计语言
      视觉风格、具体的十六进制颜色代码、字体选择、组件模式、间距系统。

      ### 4. 功能列表
      按优先级组织的每个功能。要详尽无遗。

      ### 5. Sprint 计划
      将功能分解为 3-6 个 sprint，按依赖性和重要性排序：
      - **Sprint 1** 应该建立基础（项目设置、核心数据模型、基本 UI 框架）
      - 每个后续 sprint 建立在前一个基础上
      - 清晰标记每个 sprint："Sprint 1: 基础"、"Sprint 2: 核心功能"等
      - 列出每个 sprint 的具体功能/交付物

      要具体且有主见。规格说明越具体（确切的 API 路径、具体的颜色代码、命名的库），
      生成器就能越好地构建，评估者就能越好地测试。

      重要：使用 Write 工具将规格说明写入 `$ARTIFACTS_DIR/spec.md`。不要只是将其
      输出为对话文本。
    allowed_tools: [Read, Write, Glob, Grep]

  # ─── 阶段 2：工作区初始化 ───────────────────────────────────────
  - id: init-workspace
    depends_on: [plan]
    bash: |
      ARTIFACTS="$ARTIFACTS_DIR"

      # 创建用于 harness 通信的目录结构
      mkdir -p "$ARTIFACTS/contracts"
      mkdir -p "$ARTIFACTS/feedback"
      mkdir -p "$ARTIFACTS/app"

      # 在 app 目录中初始化隔离的 git 仓库
      cd "$ARTIFACTS/app"
      git init -q
      git commit --allow-empty -m "Initial commit: adversarial-dev workspace" -q

      # Extract sprint count from spec (find highest "Sprint N" reference)
      SPEC="$ARTIFACTS/spec.md"
      SPRINT_COUNT=3
      if [ -f "$SPEC" ]; then
        FOUND=$(grep -ioE 'sprint\s+[0-9]+' "$SPEC" | grep -oE '[0-9]+' | sort -n | tail -1)
        if [ -n "$FOUND" ] && [ "$FOUND" -ge 1 ] 2>/dev/null; then
          SPRINT_COUNT=$FOUND
        fi
        if [ "$SPRINT_COUNT" -gt 10 ]; then
          SPRINT_COUNT=10
        fi
      fi

      # 写入初始状态机文件
      cat > "$ARTIFACTS/state.json" << 'STATEEOF'
      {
        "phase": "negotiating",
        "sprint": 1,
        "totalSprints": SPRINT_COUNT_PLACEHOLDER,
        "retry": 0,
        "maxRetries": 3,
        "passThreshold": 7,
        "completedSprints": [],
        "status": "running"
      }
      STATEEOF
      STATE_TMP="$ARTIFACTS/state.json.tmp"
      sed "s/SPRINT_COUNT_PLACEHOLDER/$SPRINT_COUNT/" "$ARTIFACTS/state.json" > "$STATE_TMP"
      mv "$STATE_TMP" "$ARTIFACTS/state.json"

      echo "{\"totalSprints\": $SPRINT_COUNT, \"appDir\": \"$ARTIFACTS/app\", \"artifactsDir\": \"$ARTIFACTS\"}"
    timeout: 30000

  # ─── 阶段 3：对抗式 Sprint 循环 ────────────────────────────────
  #
  # 由 $ARTIFACTS_DIR/state.json 驱动的状态机
  # 每次迭代扮演一个角色：negotiator、generator 或 evaluator
  # fresh_context 确保角色之间的真实分离
  #
  - id: adversarial-sprint
    depends_on: [init-workspace]
    idle_timeout: 600000
    model: opus[1m]
    loop:
      prompt: |
        # 对抗式开发 — Sprint 循环

        你是一个受 GAN 启发的对抗式开发系统的一部分，有三个不同的角色。
        每次迭代你扮演一个角色，由状态文件中的当前阶段决定。

        ## 首先：读取状态

        读取 `$ARTIFACTS_DIR/state.json` 来确定：
        - `phase` — 你这次迭代扮演哪个角色
        - `sprint` — 当前 sprint 编号
        - `totalSprints` — 总共有多少个 sprint
        - `retry` — 当前重试尝试（0 = 第一次尝试）
        - `maxRetries` — 硬性失败前的最大重试次数（默认 3）
        - `passThreshold` — 通过的最低分数（默认 7）

        然后读取 `$ARTIFACTS_DIR/spec.md` 获取产品上下文。

        ## 目录布局

        - 应用源代码：`$ARTIFACTS_DIR/app/`
        - Sprint 合约：`$ARTIFACTS_DIR/contracts/sprint-{N}.json`
        - 评估反馈：`$ARTIFACTS_DIR/feedback/sprint-{N}-round-{R}.json`
        - 状态机：`$ARTIFACTS_DIR/state.json`

        ---

        ## 角色：合约谈判者（phase = "negotiating"）

        你为当前 sprint 谈判成功标准。依次扮演双方：

        **步骤 1 — 生成器的提案：**
        仔细阅读规格说明。根据 sprint 计划确定 Sprint {N} 应该交付什么。
        提出一个包含 5-15 个具体、可测试标准的 sprint 合约。

        每个标准必须是具体且可验证的。示例：
        - 好："GET /api/tasks 返回 200 和 JSON 数组；每个项有 id（数字）、title（字符串）、status（字符串）、createdAt（ISO 日期）"
        - 好："点击添加任务按钮打开一个包含标题输入、优先级下拉菜单（低/中/高）和截止日期选择器的模态框"
        - 差："API 运行良好"
        - 差："可以管理任务"

        **步骤 2 — 评估者的强化：**
        现在作为对手审查你的提案。对每个标准问：
        - 它是否足够具体，可以进行程序化测试？
        - 缺少哪些边界情况？（空输入、特殊字符、并发请求）
        - 标准是否足够高，还是草率的代码也能通过？

        强化模糊的标准。添加边界情况。提高标准。

        **将最终合约写入** `$ARTIFACTS_DIR/contracts/sprint-{N}.json`：
        ```json
        {
          "sprintNumber": <N>,
          "features": ["feature1", "feature2", ...],
          "criteria": [
            {
              "name": "short-kebab-name",
              "description": "具体、可测试的必须为真的描述",
              "threshold": 7
            }
          ]
        }
        ```

        **更新 state.json**：设置 `"phase": "building"`。保持所有其他字段不变。

        ---

        ## 角色：生成器（phase = "building"）

        你是一名软件工程师。构建的功能必须能够抵御会积极尝试破坏你代码的对抗式评估者。

        **读取这些文件：**
        1. `$ARTIFACTS_DIR/spec.md` — 完整产品规格（设计语言、技术栈、所有功能）
        2. `$ARTIFACTS_DIR/contracts/sprint-{N}.json` — 你必须满足的合约
        3. 如果 `retry` > 0：读取 `$ARTIFACTS_DIR/feedback/sprint-{N}-round-{R-1}.json` 获取评估者的先前反馈

        **如果这是重试（retry > 0）：**
        仔细阅读反馈。每个失败的标准都必须解决。
        - 如果分数接近（5-6）且趋势向上：优化你的方法
        - 如果分数低（1-4）或方法从根本上是错误的：转向新策略
        - 解决每个反馈项 — 评估者会检查
        - 在提交前通过运行代码重新验证每个修复

        **构建规则：**
        - 所有代码放在 `$ARTIFACTS_DIR/app/`
        - 一次构建一个功能，验证它能工作，然后提交：
          ```bash
          cd $ARTIFACTS_DIR/app && git add -A && git commit -m "feat: 描述构建了什么"
          ```
        - 根据需要安装依赖（npm/bun/pip 等）
        - 测试你的代码 — 启动服务器、访问端点、验证 UI 渲染
        - 思考评估者会攻击什么：边界情况、错误处理、输入验证
        - 防御性构建 — 评估者的工作就是打破你

        **Update state.json**: Set `"phase": "evaluating"`. Keep all other fields unchanged.

        ---

        ## 角色：评估者（phase = "evaluating"）

        你是一个对抗式 QA agent。你的任务是打破生成器构建的东西。
        你不是有帮助的。你不是慷慨的。你是一个攻击者。

        **关键约束：**
        - 你对源代码是只读的。永远不要对 `$ARTIFACTS_DIR/app/` 中的文件使用 Write 或 Edit。
        - 你可以使用 Bash 运行应用、curl 端点、运行测试脚本、检查行为。
        - 你必须在完成前杀死你启动的任何后台进程（服务器、监视器）。
          使用：`pkill -f "node\|bun\|python\|npm" 2>/dev/null || true`
        - 你必须对合约中的每个标准评分。不能跳过。

        **评分指南：**
        - **9-10**：卓越。完美工作，包括合约未提及的边界情况。
        - **7-8**：扎实。按所述满足标准。最多只有轻微的打磨问题。
        - **5-6**：部分。核心功能存在但在重要边界情况下失败或有 bug。
        - **3-4**：弱。几乎不工作。主要差距。
        - **1-2**：损坏。不工作或未实现。

        不要按曲线评分。不要给予怀疑的好处。7 意味着"真正达到标准"。
        如果某样东西坏了，就说它坏了。

        **读取**：`$ARTIFACTS_DIR/contracts/sprint-{N}.json` 获取标准。

        **对每个标准：**
        1. 读取相关源代码
        2. 运行应用（启动服务器、测试端点、检查渲染的 UI）
        3. 尝试打破它 — 无效输入、缺失字段、边界情况、错误处理差距
        4. 诚实地评分

        **将评估写入** `$ARTIFACTS_DIR/feedback/sprint-{N}-round-{R}.json`：
        ```json
        {
          "passed": <如果所有分数 >= passThreshold 则为 true，否则为 false>,
          "scores": {
            "criterion-name": <score>,
            ...
          },
          "feedback": [
            {
              "criterion": "criterion-name",
              "score": <1-10>,
              "details": "具体发现。包含文件路径、行号、确切错误消息、失败的 curl 命令。"
            }
          ],
          "overallSummary": "什么有效、什么无效、生成器必须修复什么。"
        }
        ```

        **确定通过/失败** — `passed` 只有在每个分数都 >= `passThreshold` 时才为 `true`。

        **根据结果更新 state.json：**

        **如果通过（所有标准 >= 阈值）：**
        - 将当前 sprint 编号添加到 `completedSprints` 数组
        - 如果 `sprint` < `totalSprints`：设置 `"phase": "negotiating"`，将 `"sprint"` 加 1，设置 `"retry": 0`
        - 如果 `sprint` == `totalSprints`：设置 `"phase": "complete"`，设置 `"status": "complete"`

        **如果失败：**
        - 如果 `retry` < `maxRetries`：设置 `"phase": "building"`，将 `"retry"` 加 1
        - 如果 `retry` >= `maxRetries`：设置 `"phase": "failed"`，设置 `"status": "failed"`

        **重要**：完成前杀死所有后台进程：
        ```bash
        pkill -f "node|bun|python|npm|next|vite|webpack" 2>/dev/null || true
        ```

        ---

        ## 完成

        更新 state.json 后，检查 `status` 字段：
        - 如果 `"status": "complete"` → 所有 sprint 通过！输出：`<promise>ALL_SPRINTS_COMPLETE</promise>`
        - 如果 `"status": "failed"` → sprint 在最大重试次数后失败。输出：`<promise>ALL_SPRINTS_COMPLETE</promise>`
        - 如果 `"status": "running"` → 还有更多工作要做。不要输出任何完成信号。

      until: ALL_SPRINTS_COMPLETE
      max_iterations: 60
      fresh_context: true
      until_bash: |
        grep -qE '"status"\s*:\s*"(complete|failed)"' "$ARTIFACTS_DIR/state.json"

  # ─── 阶段 4：报告 ─────────────────────────────────────────────────
  - id: report
    depends_on: [adversarial-sprint]
    trigger_rule: all_done
    context: fresh
    model: haiku
    prompt: |
      你是一名项目报告者。生成对抗式开发运行的全面总结。

      ## 读取所有这些文件：
      1. `$ARTIFACTS_DIR/state.json` — 最终状态（告诉你成功/失败、sprint 计数）
      2. `$ARTIFACTS_DIR/spec.md` — 原始产品规格
      3. `$ARTIFACTS_DIR/contracts/` 中的所有文件 — sprint 合约（使用 Glob 查找它们）
      4. `$ARTIFACTS_DIR/feedback/` 中的所有文件 — 评估结果（使用 Glob 查找它们）

      ## 生成包含以下内容的报告：

      ### 构建总结
      - 构建了什么应用（来自规格说明）
      - 最终状态：所有 sprint 通过还是失败？在哪个 sprint？
      - 完成的 sprint 总数 vs 计划的

      ### 每个 Sprint 的分解
      对每个尝试的 sprint：
      - 合约要求什么（功能 + 关键标准）
      - 需要多少次尝试（重试计数）
      - 每个标准的最终分数
      - 驱动重试和改进的关键反馈

      ### 质量指标
      - 所有最终轮标准的平均分数
      - 哪些标准需要最多重试
      - 对抗式评估者在哪里推动了最高质量

      ### 如何运行
      - 应用代码位于：`$ARTIFACTS_DIR/app/`
      - 包含技术栈和如何启动应用（来自规格说明）
      - 包含任何设置步骤（安装依赖、环境变量等）

      将此报告写入 `$ARTIFACTS_DIR/report.md` 并将其作为你的响应输出，以便用户直接看到。
    allowed_tools: [Read, Write, Glob, Grep]
